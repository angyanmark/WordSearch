name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-slim
    steps:

      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build src/WordSearch.slnx

      - name: Test
        run: dotnet test src/WordSearch.Tests/WordSearch.Tests.csproj --no-build
